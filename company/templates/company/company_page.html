{% extends "base.html" %}
{% load wagtailcore_tags wagtailimages_tags %}

{% block content %}
    {% if page.hero_image %}
    <section class="company-hero">
        {% image page.hero_image original as img %}
        <img src="{{ img.url }}" alt="">
    </section>
    {% endif %}

    {% for block in page.body %}
        {% include_block block %}
    {% endfor %}
{% endblock %}
