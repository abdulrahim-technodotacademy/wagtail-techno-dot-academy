{% load wagtailcore_tags %}
<section class="program-info-section">
    <div class="program-info-content">
        {% if self.subtitle %}<p class="subtitle">{{ self.subtitle }}</p>{% endif %}
        {% if self.title %}<h2>{{ self.title }}</h2>{% endif %}
        <div class="rich-text">{{ self.text|richtext }}</div>
    </div>
</section>
